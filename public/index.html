<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Click anywhere to feed the little pigeons.">
    <title>Pigeon Crumbs</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="stage" aria-label="Pigeon breadcrumb playground">
      <section class="intro" aria-label="A note about pigeons">
        <nav class="site-nav" aria-label="Site navigation">
          <a href="pigeondex.html">Open PigeonDex</a>
        </nav>
        <h1>Be Kind to the Birds We Forgot</h1>
        <p>
          Pigeons share our streets every day, but most people walk past them
          without a thought. They are small city neighbors, living on scraps and
          patience. Click anywhere on the screen to leave a crumb and feed one.
        </p>
      </section>

      <section class="photo-strip" aria-label="Pigeon photo">
        <img src="assets/pigeon-hero-wide.png" alt="A pigeon standing outdoors">
      </section>

      <section class="playfield" aria-label="Click area">
        <p class="hint">Click anywhere</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
