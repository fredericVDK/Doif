<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Admin dashboard for the Pigeon Crumbs leaderboard.">
    <title>Pigeon Admin</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="site-navigation.css">
    <script src="/analytics.js" defer></script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body class="admin-locked">
    <header class="admin-header">
      <nav class="global-nav" aria-label="Site navigation">
        <a href="/">Home</a>
        <a href="/my-pigeon">My Pigeon</a>
        <a href="/pigeondex.html">PigeonDex</a>
        <a href="/shop">Shop</a>
        <a href="/inventory">Inventory</a>
        <a href="/pigder.html">Pigder</a>
        <a href="/drawings.html">Drawings</a>
        <a href="/api-docs.html">API</a>
        <a href="/admin.html" aria-current="page">Admin</a>
      </nav>
      <p class="eyebrow">Protected operations</p>
      <h1>Admin Dashboard</h1>
      <p>Moderate leaderboard entries, inspect recent events, and verify the backend storage path.</p>
    </header>

    <main class="admin-shell">
      <section class="token-panel">
        <h2>Admin token</h2>
        <form id="tokenForm">
          <input id="tokenInput" type="password" autocomplete="off" placeholder="x-admin-token">
          <button type="submit">Load admin data</button>
        </form>
        <div id="adminStatus" class="status">Enter a token to load admin data.</div>
      </section>

      <section class="admin-private">
        <div class="section-title">
          <h2>Leaderboard</h2>
          <button id="resetButton" type="button">Reset leaderboard</button>
        </div>
        <div id="leaderboardTable" class="table-list"></div>
      </section>

      <section class="admin-private">
        <h2>Recent events</h2>
        <div id="eventList" class="event-list"></div>
      </section>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
